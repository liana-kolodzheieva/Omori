<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.cdnfonts.com/css/omorigame2" rel="stylesheet" />
    <link rel="stylesheet" href="Css/style.css" />

    <title>Where are you?</title>
  </head>
  <body>
    <audio id="audio" autoplay loop>
      <source src="songs/Title.mp3" type="audio/mpeg" />
    </audio>
    <div class="container">
      <video src="gif/Start_Scene.mp4" id="start-scene"></video>
      <img
        src="gif/black_lamp.gif"
        alt="Error"
        id="black_lamp"
        class="white_lump"
      />
      <image
        src="Photo/OM_black.png"
        alt="Error"
        class="black_OMORI"
        id="black_OM"
      />
      <image
        src="Photo/RI_Black.png"
        alt="Error"
        class="black_OMORI"
        id="black_RI"
      />
      <button class="buttons" id="start" onclick="startGame()">Start</button>
    </div>
    <script src="Js/script.js"></script>
  </body>
</html>
