<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.cdnfonts.com/css/omorigame2" rel="stylesheet" />
    <link rel="stylesheet" href="Css/style.css" />

    <title id="title">Where are you?</title>
    <link rel="icon" href="Photo/MEWO.png" type="image/x-icon" />
  </head>
  <body>
    <audio id="audio">
      <source src="songs/Title.mp3" type="audio/mpeg" />
    </audio>
    <div class="container">
      <button id="start_Game" onclick="startMedia()">Start</button>
      <video src="gif/Start_Scene.mp4" id="start-scene"></video>

      <img
        src="gif/black_lamp.gif"
        alt="Error"
        id="black_lamp"
        class="white_lump"
      />

      <img
        src="Photo/OM_black.png"
        alt="Error"
        class="black_OMORI"
        id="black_OM"
      />

      <img
        src="Photo/RI_Black.png"
        alt="Error"
        class="black_OMORI"
        id="black_RI"
      />

      <img src="Photo/door.png" alt="door" id="CatDoor" />

      <img src="Photo/door.png" alt="door" id="start-door" />

      <img src="Photo/Omori-stay-right.png" alt="Omori" id="Omori" />

      <img
        src="Photo/Little-Mewo-on-the-table.png"
        alt="Mewo"
        id="Mewo-Table"
      />
      <img
        src="Photo/Cat-decision-room.png"
        alt="room"
        id="Cat-decision-room"
      />
      <img src="gif/Cat-tail.gif" alt="Tail" id="tail" />
      <img src="Photo/Mewo-emotion-1.png" alt="Mewo" id="emotion" />
      <img src="Photo/Eyes-1.png" alt="Eye" id="eyes" />
      <img src="gif/Trembl.gif" alt="tramb" id="trambl">

      <div id="white"></div>

      <button class="buttons" id="start" onclick="startGame()" disabled>
        Start
      </button>

      <div id="window">
        <div id="options">
          <button id="yes" class="buttons">Yes</button>
          <button id="no" class="buttons">No</button>
        </div>
        <div id="dialogue" class="buttons">
          <p id="text1">A black door casts a heavy shadow.</p>
          <p id="text2">Do you want to open it?</p>
        </div>
      </div>
      <video src="gif/final.mp4" loop autoplay id="final" >
    </div>
    <script src="Js/script.js"></script>
  </body>
</html>
